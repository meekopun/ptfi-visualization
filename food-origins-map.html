<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;transition:background .3s}

:root{
  --bg:        #0b0d10;
  --panel:     rgba(20,23,30,.94);
  --panel-solid:#14171e;
  --header-from:rgba(15,17,20,.96);
  --header-to: rgba(15,17,20,.82);
  --border:    #2a2f38;
  --text:      #e0e2e6;
  --text-head: #e8eaed;
  --text-muted:#9aa0a6;
  --text-dim:  #6b7280;
  --text-mid:  #b8bcc4;
  --hover-bg:  rgba(255,255,255,.06);
  --close-bg:  rgba(255,255,255,.08);
  --close-hover:rgba(255,255,255,.15);
  --row-border:rgba(255,255,255,.04);
  --bar-bg:    #1a1d23;
  --marker-border:rgba(255,255,255,.6);
  --shadow:    rgba(0,0,0,.5);
  --tooltip-bg:rgba(18,21,28,.96);
  --tooltip-border:#3a3f4a;
  --tt-name:   #f0f1f3;
  --tt-mid:    #b8bcc4;
  --zoom-bg:   rgba(20,23,30,.9);
  --zoom-text: #e0e2e6;
  --attr-bg:   rgba(15,17,20,.7);
  --attr-text: #6b7280;
  --attr-link: #9aa0a6;
}
body.light{
  --bg:        #f4f5f7;
  --panel:     rgba(255,255,255,.92);
  --panel-solid:#ffffff;
  --header-from:rgba(255,255,255,.97);
  --header-to: rgba(255,255,255,.88);
  --border:    #d1d5db;
  --text:      #1f2937;
  --text-head: #111827;
  --text-muted:#6b7280;
  --text-dim:  #9ca3af;
  --text-mid:  #4b5563;
  --hover-bg:  rgba(0,0,0,.04);
  --close-bg:  rgba(0,0,0,.06);
  --close-hover:rgba(0,0,0,.12);
  --row-border:rgba(0,0,0,.06);
  --bar-bg:    #e5e7eb;
  --marker-border:rgba(255,255,255,.85);
  --shadow:    rgba(0,0,0,.12);
  --tooltip-bg:rgba(255,255,255,.97);
  --tooltip-border:#d1d5db;
  --tt-name:   #111827;
  --tt-mid:    #4b5563;
  --zoom-bg:   rgba(255,255,255,.92);
  --zoom-text: #1f2937;
  --attr-bg:   rgba(255,255,255,.8);
  --attr-text: #9ca3af;
  --attr-link: #6b7280;
}

#map{width:100%;height:100%;background:var(--bg)}

#header{
  position:absolute;top:0;left:0;right:0;z-index:1000;
  background:linear-gradient(180deg,var(--header-from),var(--header-to));
  padding:10px 16px;border-bottom:1px solid var(--border);pointer-events:none
}
#header h1{font-size:1.05rem;font-weight:600;color:var(--text-head);letter-spacing:.02em}
#header p{font-size:.73rem;color:var(--text-muted);margin-top:3px;line-height:1.45;max-width:52rem}

#controls{
  position:absolute;top:60px;left:12px;z-index:1000;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;width:230px;backdrop-filter:blur(10px);color:var(--text);
  max-height:calc(100vh - 80px);overflow-y:auto
}
.ctrl-section{margin-bottom:14px}
.ctrl-section:last-child{margin-bottom:0}
.ctrl-label{
  font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-muted);margin-bottom:8px;font-weight:600
}

.toggle-group{display:flex;gap:0;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.toggle-btn{
  flex:1;padding:7px 4px;font-size:.74rem;text-align:center;cursor:pointer;
  background:transparent;color:var(--text-muted);border:none;font-family:inherit;
  transition:all .2s
}
.toggle-btn.active{background:#2563eb;color:#fff}
.toggle-btn:hover:not(.active){background:var(--hover-bg)}

.filter-item{
  display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;
  font-size:.78rem;user-select:none;transition:opacity .2s
}
.filter-item.off{opacity:.3;text-decoration:line-through}
.filter-swatch{width:13px;height:13px;border-radius:3px;flex-shrink:0}
.filter-count{color:var(--text-dim);font-size:.66rem;margin-left:auto;padding-left:6px}

.route-toggle{
  display:flex;align-items:center;gap:8px;font-size:.78rem;cursor:pointer;
  user-select:none;padding:2px 0;color:var(--text-mid)
}
.route-toggle input{accent-color:#2563eb}

#theme-btn{
  width:100%;padding:7px 4px;font-size:.74rem;text-align:center;cursor:pointer;
  background:transparent;color:var(--text-muted);border:1px solid var(--border);
  border-radius:6px;font-family:inherit;transition:all .2s;display:flex;
  align-items:center;justify-content:center;gap:6px
}
#theme-btn:hover{background:var(--hover-bg)}

#detail-panel{
  position:absolute;top:60px;right:12px;z-index:1000;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:0;width:320px;max-height:calc(100vh - 80px);overflow-y:auto;
  backdrop-filter:blur(10px);display:none;color:var(--text);
  box-shadow:0 8px 40px var(--shadow)
}
.dp-header{
  padding:14px 16px 10px;border-bottom:1px solid var(--border);
  position:relative
}
.dp-close{
  position:absolute;top:10px;right:12px;width:24px;height:24px;
  border:none;background:var(--close-bg);color:var(--text-muted);
  border-radius:50%;cursor:pointer;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s
}
.dp-close:hover{background:var(--close-hover);color:var(--text)}
.dp-name{font-size:.95rem;font-weight:600;padding-right:30px;line-height:1.3}
.dp-sci{font-size:.72rem;color:var(--text-muted);font-style:italic;margin-top:2px}
.dp-badge{
  display:inline-block;font-size:.65rem;padding:2px 8px;border-radius:10px;
  margin-top:6px;font-weight:500
}
.dp-body{padding:14px 16px}
.dp-section{margin-bottom:14px}
.dp-section:last-child{margin-bottom:0}
.dp-section-title{
  font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-muted);margin-bottom:6px;font-weight:600
}
.dp-row{
  display:flex;justify-content:space-between;font-size:.76rem;
  padding:3px 0;border-bottom:1px solid var(--row-border)
}
.dp-row:last-child{border-bottom:none}
.dp-row-label{color:var(--text-mid)}
.dp-row-value{color:var(--text);font-weight:500}

.macro-bar-container{margin-top:6px}
.macro-bar{
  display:flex;height:22px;border-radius:5px;overflow:hidden;
  background:var(--bar-bg);margin-bottom:8px
}
.macro-bar-seg{height:100%;transition:width .4s ease}
.macro-legend{display:flex;flex-wrap:wrap;gap:4px 12px}
.macro-legend-item{display:flex;align-items:center;gap:4px;font-size:.7rem}
.macro-legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.macro-legend-val{color:var(--text-muted)}

.leaflet-control-attribution{
  background:var(--attr-bg)!important;color:var(--attr-text)!important;
  font-size:.6rem!important
}
.leaflet-control-attribution a{color:var(--attr-link)!important}
.leaflet-control-zoom a{
  background:var(--zoom-bg)!important;color:var(--zoom-text)!important;
  border-color:var(--border)!important
}
.leaflet-control-zoom a:hover{background:rgba(37,99,235,.6)!important}

.marker-pulse{
  animation:pulse 2s ease-out infinite
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}
  70%{box-shadow:0 0 0 12px rgba(37,99,235,0)}
  100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
}

#map-stats{
  position:absolute;bottom:26px;left:12px;z-index:1000;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:8px 14px;font-size:.72rem;color:var(--text-muted);
  backdrop-filter:blur(8px);pointer-events:none
}
</style>
</head>

    <label class="route-toggle">

  <div class="ctrl-section">

/* ── Jitter overlapping collection-origin markers ── */
(function jitterCollectionCoords(){
  const buckets = {};
  foods.forEach(f => {
    const key = f.col[0]+","+f.col[1];
    if(!buckets[key]) buckets[key] = [];
    buckets[key].push(f);
  });
  Object.values(buckets).forEach(group => {
    if(group.length <= 1) return;
    const cLat = group[0].col[0], cLng = group[0].col[1];
    const maxR = Math.min(5, 1.2 * Math.sqrt(group.length));
    group.forEach((f, i) => {
      const angle = i * 2.39996323;
      const r = maxR * Math.sqrt((i+1) / group.length);
      f.col = [
        cLat + r * Math.cos(angle),
        cLng + r * Math.sin(angle) / Math.cos(cLat * Math.PI / 180)
      ];
    });
  });
})();

/* ── Jitter overlapping native-origin markers ── */
(function jitterNativeCoords(){
  const threshold = 2.5;
  for(let i = 0; i < foods.length; i++){
    for(let j = i+1; j < foods.length; j++){
      const dLat = Math.abs(foods[i].nat[0] - foods[j].nat[0]);
      const dLng = Math.abs(foods[i].nat[1] - foods[j].nat[1]);
      if(dLat < threshold && dLng < threshold){
        foods[j].nat = [
          foods[j].nat[0] + (Math.random()-.5) * 3,
          foods[j].nat[1] + (Math.random()-.5) * 3
        ];
      }
    }
  }
})();

/* ── Marker helpers ── */
function createMarkerIcon(food, isSelected){
  const color = GROUP_COLORS[food.group] || "#888";
  const size = isSelected ? 16 : 11;
  const ringColor = isDark ? "rgba(255,255,255,.6)" : "rgba(255,255,255,.85)";
  const border = isSelected ? "2.5px solid #fff" : `2px solid ${ringColor}`;
  const shadow = isSelected
    ? `0 0 0 4px ${color}44, 0 0 16px ${color}66`
    : isDark ? `0 0 8px ${color}55` : `0 0 6px ${color}88, 0 1px 3px rgba(0,0,0,.3)`;
  return L.divIcon({
    className: "",
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    html: `<div style="
      width:${size}px;height:${size}px;border-radius:50%;
      background:${color};border:${border};
      box-shadow:${shadow};cursor:pointer;
      transition:all .2s ease
    "></div>`
  });
}

function getCoords(food){
  return currentView === "native" ? food.nat : food.col;
}

/* ── Curved route line ── */
function curvedLatLngs(from, to, segments){
  segments = segments || 40;
  const pts = [];
  const midLat = (from[0] + to[0]) / 2;
  let midLng = (from[1] + to[1]) / 2;
  const dLng = to[1] - from[1];
  const curveOffset = Math.min(20, Math.abs(dLng) * 0.15 + 5);
  const perpLat = midLat + curveOffset * (dLng > 0 ? 1 : -1) * 0.3;
  for(let i = 0; i <= segments; i++){
    const t = i / segments;
    const lat = (1-t)*(1-t)*from[0] + 2*(1-t)*t*perpLat + t*t*to[0];
    const lng = (1-t)*(1-t)*from[1] + 2*(1-t)*t*midLng + t*t*to[1];
    pts.push([lat, lng]);
  }
  return pts;
}

/* ── Update all markers and routes ── */
function updateMarkers(){
  markers.forEach(m => map.removeLayer(m));
  markers.length = 0;
  routeLines.forEach(l => map.removeLayer(l));
  routeLines.length = 0;

  let visCount = 0;

  foods.forEach(food => {
    if(!activeGroups.has(food.group)) return;
    visCount++;
    const coords = getCoords(food);

    if(showMarkers){
      const icon = createMarkerIcon(food, selectedFood === food.id);
      const marker = L.marker(coords, { icon, riseOnHover: true });
      marker.bindTooltip(tooltipContent(food), {
        className: "custom-tooltip",
        direction: "top",
        offset: [0, -8],
        opacity: 1
      });
      marker.on("click", () => showDetail(food));
      marker.addTo(map);
      markers.push(marker);
    }

    if(showRoutes){
      const color = GROUP_COLORS[food.group] || "#888";
      const pts = curvedLatLngs(food.nat, food.col);
      const line = L.polyline(pts, {
        color, weight: 1.5, opacity: 0.35,
        dashArray: "6,4", className: "route-line"
      }).addTo(map);
      routeLines.push(line);
    }
  });

  document.getElementById("map-stats").textContent =
    `${visCount} of ${foods.length} foods shown · ${currentView === "native" ? "Native origin" : "Sample collection"} view`;
}

function tooltipContent(food){
  const nameClr = isDark ? "#f0f1f3" : "#111827";
  const mutedClr = isDark ? "#9aa0a6" : "#6b7280";
  const midClr   = isDark ? "#b8bcc4" : "#4b5563";
  return `<div style="font-family:'Segoe UI',system-ui,sans-serif;padding:2px 0">
    <div style="font-weight:600;font-size:.82rem;color:${nameClr}">${food.name}</div>
    <div style="font-size:.7rem;color:${mutedClr};font-style:italic">${food.sci}</div>
    <div style="font-size:.7rem;color:${GROUP_COLORS[food.group]};margin-top:2px">${food.group} · ${food.groupSec}</div>
    <div style="font-size:.68rem;color:${midClr};margin-top:2px">${
      currentView === "native"
        ? "Native: " + food.nativeRegion
        : "Collected: " + food.collectionCountry
    }</div>
  </div>`;
}

/* ── Color utilities ── */
function hexToRgb(hex){
  return {r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};
}
function rgbToHex(r,g,b){
  return "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
}
function blendFoodColors(foodList){
  const gc={};
  foodList.forEach(f=>{ if(activeGroups.has(f.group)) gc[f.group]=(gc[f.group]||0)+1; });
  let r=0,g=0,b=0,t=0;
  Object.entries(gc).forEach(([grp,cnt])=>{
    const c=hexToRgb(GROUP_COLORS[grp]);
    r+=c.r*cnt; g+=c.g*cnt; b+=c.b*cnt; t+=cnt;
  });
  return t===0 ? null : rgbToHex(Math.round(r/t),Math.round(g/t),Math.round(b/t));
}

/* ── Country heatmap ── */
const COUNTRY_NORM={
  "United States":"United States of America",
  "US":"United States of America",
  "USA":"United States of America"
};
function normC(n){ return COUNTRY_NORM[n]||n; }
let countryLayer=null, countryGeoData=null;

function getFoodsForCountry(name){
  const n=normC(name);
  return foods.filter(f=>{
    if(!activeGroups.has(f.group)) return false;
    return currentView==="native"
      ? f.nativeCountries.some(c=>normC(c)===n)
      : normC(f.collectionCountry)===n;
  });
}

function countryStyle(feature){
  const fl=getFoodsForCountry(feature.properties.name);
  if(!fl.length) return {fillColor:"transparent",fillOpacity:0,weight:0,color:"transparent"};
  const bc=blendFoodColors(fl);
  if(!bc) return {fillColor:"transparent",fillOpacity:0,weight:0,color:"transparent"};
  const op=Math.min(0.7, 0.2 + fl.length*0.1);
  return {fillColor:bc, fillOpacity:op, color:bc, weight:1.5, opacity:Math.min(0.85,op+0.15)};
}

function updateHeatmap(){
  if(countryLayer){ map.removeLayer(countryLayer); countryLayer=null; }
  if(!showHeatmap || !countryGeoData) return;
  countryLayer = L.geoJSON(countryGeoData, {
    style: countryStyle,
    onEachFeature: function(ft, layer){
      const fl = getFoodsForCountry(ft.properties.name);
      if(!fl.length) return;
      layer.on("click", function(){
        showCountryDetail(ft.properties.name, getFoodsForCountry(ft.properties.name));
      });
      layer.on("mouseover", function(e){
        const cur = getFoodsForCountry(ft.properties.name);
        if(cur.length){
          e.target.setStyle({
            weight:2.5,
            fillOpacity: Math.min(0.85, (countryStyle(ft).fillOpacity||0.3)+0.15)
          });
        }
      });
      layer.on("mouseout", function(e){
        if(countryLayer) countryLayer.resetStyle(e.target);
      });
    }
  }).addTo(map);
}

function showCountryDetail(countryName, foodsHere){
  selectedFood = null;
  const panel = document.getElementById("detail-panel");
  document.getElementById("dp-name").textContent = countryName;
  document.getElementById("dp-sci").textContent =
    currentView==="native" ? "Native origin of these foods" : "Sample collection location";

  const gs = [...new Set(foodsHere.map(f=>f.group))];
  document.getElementById("dp-badge-wrap").innerHTML = gs.map(g=>{
    const c=GROUP_COLORS[g];
    return `<span class="dp-badge" style="background:${c}22;color:${c};border:1px solid ${c}44">${g}</span> `;
  }).join("");

  let html = `<div class="dp-section">
    <div class="dp-section-title">${foodsHere.length} food${foodsHere.length>1?"s":""} in dataset</div>`;
  foodsHere.forEach(f=>{
    const c = GROUP_COLORS[f.group];
    html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;
      border-bottom:1px solid var(--row-border);cursor:pointer"
      onclick="showDetail(foods.find(x=>x.id==='${f.id}'))">
      <div style="width:10px;height:10px;border-radius:50%;background:${c};flex-shrink:0"></div>
      <div>
        <div style="font-size:.8rem;font-weight:500">${f.name}</div>
        <div style="font-size:.68rem;color:var(--text-muted);font-style:italic">${f.sci}</div>
      </div>
    </div>`;
  });
  html += `</div>`;

  if(foodsHere.length > 0){
    const avg = {water:0,carb:0,protein:0,lipid:0,ash:0};
    foodsHere.forEach(f=>{
      avg.water+=f.n.water; avg.carb+=f.n.carb;
      avg.protein+=f.n.protein; avg.lipid+=f.n.lipid; avg.ash+=f.n.ash;
    });
    const ct = foodsHere.length;
    Object.keys(avg).forEach(k=>{ avg[k]/=ct; });
    const tot = avg.water+avg.carb+avg.protein+avg.lipid+avg.ash;
    const pct = k=>((avg[k]/tot)*100).toFixed(1);

    html += `<div class="dp-section">
      <div class="dp-section-title">Average Composition (g/100 g)</div>
      <div class="macro-bar-container">
        <div class="macro-bar">
          <div class="macro-bar-seg" style="width:${pct("water")}%;background:${MACRO_COLORS.Water}"></div>
          <div class="macro-bar-seg" style="width:${pct("carb")}%;background:${MACRO_COLORS.Carbohydrate}"></div>
          <div class="macro-bar-seg" style="width:${pct("protein")}%;background:${MACRO_COLORS.Protein}"></div>
          <div class="macro-bar-seg" style="width:${pct("lipid")}%;background:${MACRO_COLORS.Lipid}"></div>
          <div class="macro-bar-seg" style="width:${pct("ash")}%;background:${MACRO_COLORS.Ash}"></div>
        </div>
        <div class="macro-legend">
          ${Object.entries(MACRO_COLORS).map(([k,c])=>{
            const key = k==="Carbohydrate" ? "carb" : k.toLowerCase();
            return `<span class="macro-legend-item">
              <span class="macro-legend-swatch" style="background:${c}"></span>
              ${k} <span class="macro-legend-val">${avg[key].toFixed(1)}</span>
            </span>`;
          }).join("")}
        </div>
      </div>
    </div>`;
  }

  document.getElementById("dp-body").innerHTML = html;
  panel.style.display = "block";
}

/* ── Master render ── */
function render(){ updateHeatmap(); updateMarkers(); }

/* ── Load country boundaries ── */
fetch("https://unpkg.com/world-atlas@2.0.2/countries-110m.json")
  .then(r=>r.json())
  .then(topo=>{
    countryGeoData = topojson.feature(topo, topo.objects.countries);
    updateHeatmap();
  })
  .catch(e=>console.warn("Could not load country boundaries:", e));

/* ── Initial render ── */
render();
</script>
